# Publikacja aplikacji na GitHub Pages (opcjonalna).
#
# Jak włączyć:
# 1. W repozytorium: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
# 2. Actions → „Publikacja na GitHub Pages” → Run workflow (publikacja ręczna).
# 3. (Opcjonalnie) Settings → Secrets and variables → Actions → Variables:
#    dodaj zmienną DEPLOY_PAGES = true, aby publikować automatycznie po każdym wysłaniu do main.
#
# Bez tych kroków zadania są pomijane, więc workflow nie zgłasza błędów.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
